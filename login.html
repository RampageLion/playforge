<!doctype html>
<html>
<head>
	<meta charset='utf-8'>
	<title>PlayForge - Вход</title>
	<link rel='icon' href='img/favicon.png' type='image/png'>
	<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css' integrity='sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==' crossorigin='anonymous' referrerpolicy='no-referrer' />
	<link rel='stylesheet' href='style.css'>
	<script src='login.js' defer></script>
</head>
<body class='login-body'>
	<div class='container login-container'>
		<header>
			<div class='brand'>
				<div class='logo'>PF</div>
				<div>
					<h1>PlayForge</h1>
					<div class='logo-desc'>Игры, скидки</div>
				</div>
			</div>
			<nav>
				<a href='index.html' class='icon-btn'>Магазин</a>
			</nav>
		</header>
		<div class='auth-wrapper'>
            	<div class='form-box'>
				<div class='button-box'>
					<div id='btn'></div>
					<button type='button' class='toggle-btn' onclick='login()'>Вход</button>
					<button type='button' class='toggle-btn' onclick='register()'>Регистрация</button>
				</div>

				<form id='login' class='input-group'>
					<h2>Вход</h2>
					<input type='email' class='input-field' placeholder='Email' required>
					<input type='password' class='input-field' placeholder='Пароль' required>
					<button type='submit' class='submit-btn'>Войти</button>
				</form>

				<form id='register' class='input-group'>
					<h2>Регистрация</h2>
					<input type='text' class='input-field' placeholder='Имя пользователя' required>
					<input type='email' class='input-field' placeholder='Email' required>
					<input type='password' class='input-field' placeholder='Пароль' required>
					<button type='submit' class='submit-btn'>Зарегистрироваться</button>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
